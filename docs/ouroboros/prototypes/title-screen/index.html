<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUROBOROS</title>
<style>
  :root {
    --bg: #0b0e0c;
    --bone: #d8d3c4;
    --bone-dim: #8a877c;
    --scale-a: #3f5a44;
    --scale-b: #2e4536;
    --scale-glow: #6d9a76;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--bone);
    font-family: "Courier New", ui-monospace, monospace;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 40%, rgba(0,0,0,.55) 100%);
  }

  .stage { position: relative; width: min(80vmin, 640px); height: min(80vmin, 640px); }

  /* The seam lives on the svg, the spin on the group inside it, so the two
     transform animations never fight. */
  svg {
    width: 100%; height: 100%; display: block;
    animation: seam 13s steps(2, end) infinite 6s;
  }
  #snake {
    transform-origin: 300px 300px;
    animation: spin 26s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Threshold-0 foreshadowing: once per cycle, for a frame-pair, the ring
     isn't quite right. Deniable ("that's just a weird texture"). */
  @keyframes seam {
    0%, 96%   { transform: none; filter: none; }
    96.4%, 96.8% { transform: translate(2px,-1px); filter: saturate(.2) brightness(1.5); }
    97%, 100% { transform: none; filter: none; }
  }

  /* Load-in: the ring IS the loading bar. Each segment carries its own
     delay (--d, tail-first); the head lands last and closes the bite. */
  .seg { opacity: 0; animation: appear .18s ease forwards; animation-delay: var(--d); }
  @keyframes appear { to { opacity: 1; } }

  .menu {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .6rem; text-align: center;
  }
  h1 {
    font-size: clamp(1.3rem, 3.8vmin, 2rem);
    font-weight: 400;
    letter-spacing: .45em;
    text-indent: .45em;
    opacity: 0;
    animation: appear 1.6s ease forwards 2.6s;
  }
  .buttons {
    display: flex; flex-direction: column; gap: .4rem; margin-top: 1.4rem;
    opacity: 0; animation: appear 1.2s ease forwards 2.9s;
  }
  .btn, button {
    background: none; border: none; display: block;
    color: var(--bone);
    font: inherit; font-size: clamp(.8rem, 2.2vmin, 1rem);
    letter-spacing: .35em; text-indent: .35em;
    padding: .5em 1.2em;
    cursor: pointer;
  }
  .btn:hover, .btn:focus-visible { color: var(--scale-glow); outline: none; }
  .btn:hover::before, .btn:focus-visible::before { content: "\203A "; margin-right: -.35em; }
  button:disabled { color: #3a3d38; cursor: default; }

  .footer {
    position: fixed; bottom: 4vh; left: 0; right: 0;
    text-align: center;
    font-size: .65rem; letter-spacing: .25em; text-indent: .25em;
    color: var(--bone-dim);
    opacity: 0; animation: appear 2s ease forwards 3.6s;
  }

  /* NEW GAME works with no scripts at all: a checkbox holds the state and
     the shroud answers to :checked. JS, when present, only adds the shell
     event on top. */
  #ng { position: absolute; opacity: 0; pointer-events: none; }
  .shroud {
    position: fixed; inset: 0; background: #000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1rem;
    opacity: 0; pointer-events: none;
    transition: opacity 1.8s ease;
  }
  #ng:checked ~ .shroud { opacity: 1; pointer-events: all; }
  .shroud .loop { letter-spacing: .5em; text-indent: .5em; font-size: 1rem; }
  .shroud .line {
    color: var(--bone-dim); font-size: .7rem;
    letter-spacing: .2em; text-indent: .2em;
    opacity: 0; transition: opacity 2.4s ease 1.6s;
  }
  #ng:checked ~ .shroud .line { opacity: 1; }
</style>
</head>

<script>
/* Optional enhancement only — every visual above runs on pure CSS.
   With scripts available, the shell gets its integration hooks. */
(() => {
  const ng = document.getElementById('ng');
  ng.addEventListener('change', () => {
    if (ng.checked) window.dispatchEvent(new CustomEvent('ouroboros:newgame'));
  });
  // Keyboard support for the label-as-button.
  document.querySelector('label[for="ng"]').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ng.click(); }
  });
  // Shell-driven loading: first call takes over from the CSS self-load.
  const segs = [...document.querySelectorAll('.seg')];
  let manual = false, shown = 0;
  window.OUROBOROS_TITLE = {
    setProgress(p) {
      if (!manual) { manual = true; segs.forEach(s => { s.style.animation = 'none'; s.style.opacity = 0; }); shown = 0; }
      const target = Math.max(0, Math.min(segs.length, Math.floor(p * segs.length)));
      while (shown < target) segs[shown++].style.opacity = 1;
    }
  };
})();
</script>
