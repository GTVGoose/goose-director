<meta charset="utf-8">
<title>Tuna Course Expediter</title>
<style>

  .head { text-align: center; border-bottom: 3px double #111; padding-bottom: 6px; margin-bottom: 8px; }

  .gc-label { background: #eee; font-weight: bold; text-align: right; padding: 4px 8px; font-size: 10px;

  .gc-cell { height: 26px; background: #fff; }
  td.course { padding: 2px 6px; }
  .cnum { color: #555; font-size: 10px; margin-right: 6px; }
  .cline { display: inline-block; border-bottom: 1px solid #999; width: 150px; }
  td.check { height: 30px; }
